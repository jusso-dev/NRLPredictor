name: NRLPredictor
options:
  bundleIdPrefix: au.indigi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Ad-hoc signing: enough for the simulator, and required for Keychain access.
    # Set DEVELOPMENT_TEAM in Xcode when building for a device.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"

targets:
  NRLPredictor:
    type: application
    platform: iOS
    sources:
      - path: NRLPredictor
    settings:
      base:
        PRODUCT_NAME: NRL Predictor
        PRODUCT_BUNDLE_IDENTIFIER: au.indigi.nrlpredictor
        INFOPLIST_FILE: NRLPredictor/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
